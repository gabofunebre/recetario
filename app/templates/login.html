{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 auth-panel">
    <p class="eyebrow">BIENVENIDO A TU RECETARIO</p>
    <h1 class="mb-3">Iniciar sesión</h1>
    <p class="text-muted mb-4">Tus recetas, listas para volver a la mesa.</p>
    <form method="POST">
      <div class="mb-3">
        <label for="login-nombre" class="form-label">Usuario</label>
        <input id="login-nombre" autocomplete="username" type="text" name="nombre" class="form-control" placeholder="Usuario" required>
      </div>
      <div class="mb-3">
        <label for="login-clave" class="form-label">Contraseña</label>
        <input id="login-clave" autocomplete="current-password" type="password" name="clave" class="form-control" placeholder="Contraseña" required>
      </div>
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Ingresar</button>
      </div>
    </form>
    <div class="text-center">
      <a href="{{ url_for('main.register') }}">Registrarse</a>
    </div>
  </div>
</div>
{% endblock %}
